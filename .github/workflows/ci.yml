name: CI

# Runs the offline test suite only.
#
# `npm run eval` is deliberately NOT run here. It calls a real model against the
# labeled fixtures, which needs an API key and costs money on every push. The
# scorer's own tests are pure and offline, so they are the right thing to gate
# on — and they are what catches the scoring drifting out from under the eval.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and scorer tests
        run: npm test
